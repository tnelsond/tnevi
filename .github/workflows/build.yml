name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub (any tag name) builds, signs and attaches the APKs.
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Unit tests and swipe accuracy
        run: |
          mkdir -p /tmp/t
          D=app/src/main/java/dev/vimkeyboard
          javac -d /tmp/t $D/VimEngine.java $D/SwipeDecoder.java $D/LanguageModel.java $D/Layout.java test/*.java
          java -cp /tmp/t VimEngineTest
          for L in en km; do
            java -cp /tmp/t SwipeContextTest packs/$L/assets/lm.bin test/lm_heldout_$L.txt packs/$L/assets/layout.txt 0.07
          done
      - name: Build
        run: ./gradlew assembleDebug assembleRelease

      # Release APKs are signed with the repository's own key, kept in Actions secrets:
      #   KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS.
      # The same key must sign the keyboard and its packs, and every future release, so that
      # updates install over each other and the keyboard accepts the packs.
      - name: Sign release APKs
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in secrets (KEYSTORE_BASE64); only debug APKs were built."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail() { echo "::error::$*"; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || fail "The KEYSTORE_PASSWORD secret is missing or empty."
          [ -n "$KEY_ALIAS" ] || fail "The KEY_ALIAS secret is missing or empty (it should be: tnevi)."
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS" 2>/dev/null \
            || fail "KEYSTORE_BASE64 is not valid base64. Paste the whole output of: base64 -w0 tnevi-release.p12"
          [ -s "$KS" ] || fail "KEYSTORE_BASE64 decoded to an empty file."
          echo "keystore: $(stat -c%s "$KS") bytes"
          keytool -list -keystore "$KS" -storepass:env KEYSTORE_PASSWORD >/dev/null 2>&1 \
            || fail "Could not open the keystore: KEYSTORE_PASSWORD is wrong, or KEYSTORE_BASE64 is not the .p12/.jks file."
          keytool -list -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || fail "The keystore has no key with the name in KEY_ALIAS. Keys in it: $(keytool -list -keystore "$KS" -storepass:env KEYSTORE_PASSWORD 2>/dev/null | grep -i PrivateKeyEntry | cut -d, -f1 | tr '\n' ' ')"
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          BT=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          [ -x "$BT/apksigner" ] || fail "apksigner not found under $SDK/build-tools"
          echo "build-tools: $BT"
          VERSION=${GITHUB_REF_NAME#v}
          [ "$GITHUB_EVENT_NAME" = release ] || VERSION="$VERSION-$(git rev-parse --short HEAD)"
          mkdir -p dist
          sign() {
            [ -f "$1" ] || fail "Missing $1. Release outputs: $(ls app/build/outputs/apk/release packs/*/build/outputs/apk/release 2>&1 | tr '\n' ' ')"
            "$BT/zipalign" -f 4 "$1" "$RUNNER_TEMP/aligned.apk" || fail "zipalign failed on $1"
            "$BT/apksigner" sign --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
                --out "$2" "$RUNNER_TEMP/aligned.apk" || fail "apksigner could not sign $1"
            "$BT/apksigner" verify "$2" || fail "Signature check failed for $2"
            echo "signed $2"
          }
          sign app/build/outputs/apk/release/app-release-unsigned.apk "dist/tnevi-$VERSION.apk"
          sign packs/en/build/outputs/apk/release/pack-en-release-unsigned.apk "dist/tnevi-pack-en-$VERSION.apk"
          sign packs/km/build/outputs/apk/release/pack-km-release-unsigned.apk "dist/tnevi-pack-km-$VERSION.apk"
          rm -f "$KS"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            packs/*/build/outputs/apk/debug/*.apk
      - name: Upload signed APKs
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: dist/*.apk

      - name: Refuse to release without the signing key
        if: github.event_name == 'release' && steps.sign.outputs.signed != 'true'
        run: |
          echo "::error::Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS to the repository secrets, then publish the release again."
          exit 1
      - name: Attach APKs to the release
        if: github.event_name == 'release' && steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
