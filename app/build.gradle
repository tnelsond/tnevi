plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vimkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.vimkeyboard'
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName '3.0'
    }

    buildTypes {
        release {
            // Unsigned: CI signs release APKs with the key stored in the repo's secrets.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}
