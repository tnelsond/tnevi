plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vimkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.vimkeyboard'
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
