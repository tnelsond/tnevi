plugins {
    id 'com.android.application'
}

// Language pack: a data-only APK read by the keyboard (same signing key required).
android {
    namespace 'dev.vimkeyboard.pack.en'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.vimkeyboard.pack.en'
        minSdk 21
        targetSdk 34
        // Releases built on GitHub take their version from the release tag and run number,
        // so every release installs as an update over the previous one.
        versionCode System.getenv('GITHUB_RUN_NUMBER') ? 1000 + System.getenv('GITHUB_RUN_NUMBER').toInteger() : 12
        versionName System.getenv('RELEASE_VERSION') ?: '3.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            assets.srcDirs = ['assets']
            res.srcDirs = ['res']
        }
    }

    buildTypes {
        release {
            // Unsigned: CI signs release APKs with the key stored in the repo's secrets.
            minifyEnabled false
        }
    }

    lint {
        checkReleaseBuilds false
    }
}
